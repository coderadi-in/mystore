<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="A simple dummy store for testing product orders.">
    <title>Simple Store | Home</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
  </head>
  <body>
    <header class="site-header">
      <div class="container header-content">
        <a class="logo" href="index.html">Simple Store</a>
        <nav aria-label="Main navigation">
          <a class="active" href="index.html">Home</a>
          <a href="products.html">Products</a>
        </nav>
      </div>
    </header>

    <main>
      <section class="hero">
        <div class="container hero-content">
          <p class="eyebrow">Dummy store</p>
          <h1>Useful products, simple ordering.</h1>
          <p class="hero-copy">Browse our sample collection and send an order request in a few steps.</p>
          <a class="button" href="products.html">View products</a>
        </div>
      </section>

      <section class="container section">
        <div class="section-heading">
          <div>
            <p class="eyebrow">Featured</p>
            <h2>Popular picks</h2>
          </div>
          <a href="products.html">See all products</a>
        </div>
        <div class="product-grid" data-product-list="featured"></div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container">
        <p>Simple Store &middot; A test storefront</p>
      </div>
    </footer>
  </body>
</html>
